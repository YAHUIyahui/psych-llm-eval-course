name: course-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Library tests
        run: pytest -q
      - name: Rebuild materials and check they match the repository
        run: |
          python build/build_all.py
          git diff --stat -- lessons/*/slides.html lessons/*/README.md index.html coursework.html
      - name: Execute every notebook and verify every solution
        run: python build/verify.py --no-write
